<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1330">
<meta name="description" content="CHESS OZAK - play chess offline against bots, solve puzzles and track your rating.">
<title>CHESS OZAK</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{--bg-main:#0e1330;--bg-panel:#161d45;--bg-light:#dbe4f7;--bg-dark:#5a76b0;--accent:#f2c14e;--on:#1a1300;--text:#fff;--text-muted:#9ba3c7;--danger:#e53935;--sq:min(100vw,calc(100dvh - 270px))}
body.theme-wood{--bg-main:#312e2b;--bg-panel:#262522;--bg-light:#f0d9b5;--bg-dark:#b58863;--accent:#81b64c;--on:#fff;--text-muted:#a3a2a0}
body.theme-ocean{--bg-main:#1a1e24;--bg-panel:#222831;--bg-light:#dee3e6;--bg-dark:#8ca2ad;--accent:#00bcd4;--on:#fff}
body.theme-sunset{--bg-main:#2d1d28;--bg-panel:#3a2532;--bg-light:#f1d6c5;--bg-dark:#c08375;--accent:#ff7043;--on:#fff}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic","Noto Sans",sans-serif;background:var(--bg-main);color:var(--text);height:100dvh;width:100vw;overflow:hidden;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
#app{flex:1;display:flex;flex-direction:column;position:relative;overflow:hidden}
button{font-family:inherit}
.splash{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:15px;background:radial-gradient(circle at center,#3a3632,var(--bg-main))}
.crown{font-size:80px;animation:float 3s ease-in-out infinite}
.logo{font-size:42px;font-weight:800;color:var(--accent);letter-spacing:2px}
.sub{color:var(--text-muted);margin-bottom:30px}
.big{background:var(--accent);color:var(--on);padding:15px 40px;border:0;border-radius:30px;font-size:20px;font-weight:700;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.3)}
.big:active{transform:translateY(6px);box-shadow:none}
@keyframes float{50%{transform:translateY(-15px)}}
.dashboard,.page{flex:1;display:flex;flex-direction:column;padding:20px 15px 80px;overflow-y:auto}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.prof{display:flex;align-items:center;gap:12px;cursor:pointer}
.avatar{width:45px;height:45px;background:#444;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;border:2px solid var(--accent)}
.muted{color:var(--text-muted);font-size:14px}
.play{width:100%;margin-bottom:25px;border-radius:15px;font-size:24px;padding:20px;text-transform:uppercase}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-bottom:25px}
.card{background:var(--bg-panel);padding:20px 15px;border-radius:15px;display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;font-weight:700}
.card:active{transform:scale(.95)}.card i{font-size:32px;font-style:normal}
.recent{display:flex;gap:10px;overflow-x:auto;padding-bottom:10px}
.ri{background:var(--bg-panel);padding:12px 15px;border-radius:12px;min-width:130px;border-inline-start:4px solid #888}
.ri.win{border-color:var(--accent)}.ri.lose{border-color:var(--danger)}
.up{color:#81b64c}.down{color:#e53935}
nav{position:absolute;bottom:0;left:0;right:0;height:calc(65px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--bg-panel);display:flex;border-top:1px solid #1a1a1a;z-index:10}
nav button{flex:1;background:none;border:0;color:var(--text-muted);font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
nav button.on{color:var(--accent)}nav b{font-size:20px}
.title{font-size:24px;font-weight:800;margin-bottom:20px}
.item{background:var(--bg-panel);padding:15px;border-radius:12px;margin-bottom:10px;display:flex;align-items:center;gap:15px;cursor:pointer;border:2px solid transparent}
.item:active{border-color:var(--accent)}.item i{font-size:30px;font-style:normal}.item div{flex:1}
.row{display:flex;justify-content:space-between;align-items:center;background:var(--bg-panel);padding:15px;border-radius:12px;margin-bottom:10px;font-weight:600}
select{background:var(--bg-main);color:#fff;border:1px solid #444;padding:8px;border-radius:8px}
.game{flex:1;display:flex;flex-direction:column}
.gh,.bar{display:flex;justify-content:space-between;align-items:center;padding:8px 15px}
.back{background:none;border:0;color:#fff;font-size:18px;font-weight:600}
.pl{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px}
.pl .avatar{width:30px;height:30px;font-size:16px}
.timer{background:var(--bg-panel);padding:6px 15px;border-radius:8px;font-weight:700;font-size:22px;font-variant-numeric:tabular-nums;color:var(--text-muted)}
.timer.active{background:#fff;color:#000}.timer.low{background:var(--danger);color:#fff}
.bc{flex:1;display:flex;align-items:center;justify-content:center;padding:5px}
.board{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);width:var(--sq);height:var(--sq);border-radius:4px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.5);direction:ltr}
.sq{position:relative;display:flex;align-items:center;justify-content:center}
.sq.light{background:var(--bg-light)}.sq.dark{background:var(--bg-dark)}
.sq.selected{box-shadow:inset 0 0 0 4px rgba(129,182,76,.9)}
.sq.last-move{background:rgba(242,193,78,.55)!important}
.sq.last-move .piece{animation:pop .2s}
.sq.hint-m{box-shadow:inset 0 0 0 4px #4ade80}
.sq.hint::before{content:'';position:absolute;width:30%;height:30%;border-radius:50%;background:rgba(0,0,0,.25)}
.sq.capture::before{content:'';position:absolute;inset:0;border-radius:50%;border:6px solid rgba(0,0,0,.25)}
.sq.check{background:radial-gradient(circle,#ff5252 30%,transparent 80%)!important}
.piece{font-size:calc(var(--sq)/8*.84);line-height:1;pointer-events:none;font-family:"Segoe UI Symbol","Noto Sans Symbols 2","Apple Symbols",serif}
.piece.w{color:#fff;-webkit-text-stroke:1.2px #222;text-shadow:0 2px 3px rgba(0,0,0,.4)}
.piece.b{color:#1b1b1b;-webkit-text-stroke:.6px #bbb;text-shadow:0 2px 3px rgba(0,0,0,.4)}
.ctl{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:10px 15px calc(10px + env(safe-area-inset-bottom))}
.cb{background:var(--bg-panel);border:0;color:var(--text-muted);padding:10px 13px;border-radius:10px;font-weight:600;font-size:14px}
.cb.danger{color:var(--danger)}
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal{background:var(--bg-panel);padding:25px;border-radius:20px;width:100%;max-width:380px;text-align:center}
.modal h2{margin-bottom:15px}.modal .piece{font-size:44px}
.btn{display:block;width:100%;padding:14px;margin:8px 0;border:0;border-radius:12px;font-size:16px;font-weight:700;background:#444;color:#fff}
.btn.primary{background:var(--accent);color:var(--on)}.btn.danger{background:var(--danger)}
@keyframes pop{from{transform:scale(.6);opacity:.4}to{transform:scale(1);opacity:1}}
.logo-svg{filter:drop-shadow(0 8px 14px rgba(0,0,0,.5))}
.xp{height:5px;width:110px;background:#0006;border-radius:3px;margin-top:4px;overflow:hidden}.xp i{display:block;height:100%;background:var(--accent)}
.ebar{height:6px;background:#0009;margin:0 15px;border-radius:3px;overflow:hidden;direction:ltr}.ebar i{display:block;height:100%;background:#fff;transition:width .4s}
.moves{direction:ltr;display:flex;gap:6px;overflow-x:auto;padding:6px 15px;font-size:13px;color:var(--text-muted);min-height:30px;align-items:center;white-space:nowrap}
.moves::-webkit-scrollbar{display:none}.moves b{color:var(--accent);font-weight:600}.moves span{background:var(--bg-panel);padding:2px 7px;border-radius:6px;color:#fff}
.cap{font-size:13px;color:var(--text-muted);margin-inline-start:6px;letter-spacing:-2px;font-weight:400}
.co{position:absolute;font-size:9px;font-weight:700;text-decoration:none;opacity:.75;pointer-events:none;color:#33415f}.co.r{top:2px;left:3px}.co.f{bottom:1px;right:3px}
.chips{display:flex;gap:8px;justify-content:center;margin:8px 0 14px;flex-wrap:wrap}
.chip{background:#0004;border:2px solid transparent;color:#fff;padding:9px 14px;border-radius:10px;font-weight:600}.chip.on{border-color:var(--accent);color:var(--accent)}
</style>
</head>

const LOGO=(s)=>`<svg class="logo-svg" width="${s}" height="${s}" viewBox="0 0 100 100"><defs><linearGradient id="lg${s}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe08a"/><stop offset="1" stop-color="#d79a1f"/></linearGradient></defs><path d="M50 4 90 18v30c0 24-16 40-40 48C26 88 10 72 10 48V18z" fill="#161d45" stroke="url(#lg${s})" stroke-width="5" stroke-linejoin="round"/><text x="50" y="69" text-anchor="middle" font-size="58" fill="url(#lg${s})" font-family="'Segoe UI Symbol','Noto Sans Symbols 2','Apple Symbols',serif">♞\uFE0E</text></svg>`;

/* ---------- engine ---------- */
const PV={P:100,N:320,B:330,R:500,Q:900,K:20000};

class Chess{
 constructor(fen){this.setFen(fen||'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1')}
 setFen(f){let p=f.split(' ');this.board=p[0].split('/').map(row=>{let a=[];for(let ch of row){if(ch>='1'&&ch<='8')for(let i=0;i<+ch;i++)a.push(null);else a.push((ch===ch.toUpperCase()?'w':'b')+ch.toUpperCase())}return a});
  this.turn=p[1]||'w';let c=p[2]||'-';this.castling={wK:c.includes('K'),wQ:c.includes('Q'),bK:c.includes('k'),bQ:c.includes('q')};this.enPassant=null;this.halfMoveClock=0}

 findKing(col){for(let r=0;r<8;r++)for(let c=0;c<8;c++)if(this.board[r][c]===col+'K')return{r,c};return null}

 pseudoMoves(col){
  let mv=[],opp=col==='w'?'b':'w';

   let p=this.board[r][c];if(!p||p[0]!==col)continue;let t=p[1];
   if(t==='P'){

   }else if(t==='N'||t==='K'){
    for(let[a,b]of(t==='N'?KN:KG)){let nr=r+a,nc=c+b;if(!this.inB(nr,nc))continue;let tg=this.board[nr][nc];if(!tg||tg[0]!==col)mv.push(M(r,c,nr,nc,p,tg))}
    let hr=col==='w'?7:0;
    if(t==='K'&&r===hr&&c===4&&!this.isAttacked(r,c,opp)){
     let B=this.board[hr];

 isCheckmate(){return this.inCheck(this.turn)&&!this.legalMoves().length}
 isStalemate(){return !this.inCheck(this.turn)&&!this.legalMoves().length}
 insufficient(){let n=[];for(let r=0;r<8;r++)for(let c=0;c<8;c++){let p=this.board[r][c];if(p&&p[1]!=='K'){if('PRQ'.includes(p[1]))return false;n.push(p)}}return n.length<=1}
}
function evaluate(g,persp){
 let s=0;
 for(let r=0;r<8;r++)for(let c=0;c<8;c++){
  let p=g.board[r][c];if(!p)continue;let t=p[1],v=PV[t];
  let cen=3.5-Math.max(Math.abs(r-3.5),Math.abs(c-3.5));
  if(t==='N'||t==='B')v+=cen*6;else if(t==='P')v+=cen*3+(p[0]==='w'?6-r:r-1)*4;
  s+=p[0]===persp?v:-v}
 return s}
function ordered(g){
 return g.legalMoves().map(m=>({m,k:(m.captured?PV[m.captured[1]]*10-PV[m.piece[1]]:0)+(m.promotion?800:0)})).sort((a,b)=>b.k-a.k).map(x=>x.m)}
function search(g,d,al,be,persp){
 if(d===0)return evaluate(g,persp);
 let ms=ordered(g);
 if(!ms.length)return g.inCheck(g.turn)?(g.turn===persp?-1e5-d:1e5+d):0;
 if(g.turn===persp){let b=-1e9;for(let m of ms){let u=g.makeMove(m);b=Math.max(b,search(g,d-1,al,be,persp));g.undoMove(u);al=Math.max(al,b);if(be<=al)break}return b}
 let b=1e9;for(let m of ms){let u=g.makeMove(m);b=Math.min(b,search(g,d-1,al,be,persp));g.undoMove(u);be=Math.min(be,b);if(be<=al)break}return b}
function getBestMove(g,depth,blunder){
 let ms=ordered(g),persp=g.turn;if(!ms.length)return null;
 if(Math.random()<blunder)return ms[Math.floor(Math.random()*ms.length)];
 let best=ms[0],bs=-1e9;
 for(let m of ms){let u=g.makeMove(m),s=search(g,depth-1,-1e9,1e9,persp);g.undoMove(u);if(s>bs){bs=s;best=m}}
 return best}

function renderGame(){
 let ck=game.inCheck(game.turn)?game.findKing(game.turn):null,h='';
 for(let i=0;i<8;i++)for(let j=0;j<8;j++){
  let r=flipped?7-i:i,c=flipped?7-j:j,cl='sq '+((r+c)%2?'dark':'light');
  if(selected&&selected.r===r&&selected.c===c)cl+=' selected';
  if(lastMove&&((lastMove.from.r===r&&lastMove.from.c===c)||(lastMove.to.r===r&&lastMove.to.c===c)))cl+=' last-move';
  if(ck&&ck.r===r&&ck.c===c)cl+=' check';
  if(hintMv&&((hintMv.from.r===r&&hintMv.from.c===c)||(hintMv.to.r===r&&hintMv.to.c===c)))cl+=' hint-m';
  if(legalMoves.some(m=>m.to.r===r&&m.to.c===c))cl+=game.board[r][c]?' capture':' hint';
  let p=game.board[r][c];h+=`<div class="${cl}" onclick="sqClick(${r},${c})">${p?PIECES[p]:''}${j===0?`<s class="co r">${8-r}</s>`:''}${i===7?`<s class="co f">${'abcdefgh'[c]}</s>`:''}</div>`}
 let m=state.mode,title=m==='puzzle'?T('puzzles'):m==='analysis'?T('analysis'):'CHESS OZAK';
 let top=`<div class="gh"><button class="back" onclick="${m==='puzzle'?"go('puzzles')":m==='analysis'?"go('home')":'exitGame()'}">← ${T('back')}</button><b style="color:var(--accent)">${title}</b><span style="width:60px"></span></div>`;
 if(m==='bot')top+=`<div class="bar"><div class="pl"><div class="avatar">🤖</div>${T('bot')} (${state.botElo}) ${cap(pc==='w'?'b':'w')}</div><div class="timer ${game.turn!==pc?'active':''}" id="top-timer">${aiThinking?T('thinking'):formatTime(pc==='w'?bTime:wTime)}</div></div>`;
 let bot=m==='bot'?`<div class="bar"><div class="timer ${game.turn===pc?'active':''}" id="bottom-timer">${formatTime(pc==='w'?wTime:bTime)}</div><div class="pl">${T('you')} (${state.elo}) ${cap(pc)}<div class="avatar">👤</div></div></div>
 <div class="ctl"><button class="cb danger" onclick="resign()">🏳️ ${T('resign')}</button><button class="cb" onclick="offerDraw()">🤝 ${T('draw')}</button><button class="cb" aria-label="${T('hint')}" onclick="giveHint()">💡</button><button class="cb" aria-label="${T('undo')}" onclick="undoMove()">↩</button><button class="cb" onclick="flipBoard()">🔄 ${T('flip')}</button></div>`
 :m==='analysis'?`<div class="ctl"><button class="cb" onclick="startAnalysis()">${T('newGame')}</button><button class="cb" onclick="undoMove()">↩ ${T('undo')}</button><button class="cb" onclick="flipBoard()">🔄 ${T('flip')}</button></div>`

 app.innerHTML=`<div class="game">${top}${m!=='puzzle'?evalBar():''}<div class="bc"><div class="board">${h}</div></div>${m!=='puzzle'?movesStrip():''}${bot}</div>`;let mv=$('mv');if(mv)mv.scrollLeft=mv.scrollWidth}
function flipBoard(){flipped=!flipped;renderGame()}
function undoMove(){if(aiThinking||!hist.length)return;let n=state.mode==='bot'?(game.turn===pc?2:1):1;if(state.mode==='bot'&&(gameOver||hist.length-n<(pc==='b'?1:0)))return;for(let i=0;i<n&&hist.length;i++){game.undoMove(hist.pop());sans.pop()}lastMove=null;selected=null;legalMoves=[];hintMv=null;renderGame();saveGame()}

function evalBar(){let p=50+50*Math.tanh(evaluate(game,'w')/500);return `<div class="ebar"><i style="width:${p}%"></i></div>`}

function matDiff(side){let s=0;for(let r of game.board)for(let p of r)if(p&&p[1]!=='K')s+=(p[0]===side?1:-1)*({P:1,N:3,B:3,R:5,Q:9}[p[1]]);return s}
function cap(side){let init={P:8,N:2,B:2,R:2,Q:1},cnt={},o=side==='w'?'b':'w',h='';for(let r of game.board)for(let p of r)if(p&&p[0]===o)cnt[p[1]]=(cnt[p[1]]||0)+1;
 for(let t of'QRBNP'){let miss=init[t]-(cnt[t]||0);for(let i=0;i<miss;i++)h+=GL[t]}let d=matDiff(side);return `<span class="cap">${h}${d>0?' +'+d:''}</span>`}

function sqClick(r,c){
 if(gameOver||aiThinking||pendingPromo)return;
 if(state.mode==='bot'&&game.turn!==pc)return;
 let ms=legalMoves.filter(m=>m.to.r===r&&m.to.c===c);
 if(ms.length){if(ms[0].promotion){showPromo(ms);return}executeMove(ms[0]);return}
 let p=game.board[r][c];
 if(p&&p[0]===game.turn){selected={r,c};legalMoves=game.legalMoves().filter(m=>m.from.r===r&&m.from.c===c)}else{selected=null;legalMoves=[]}
 renderGame()}

function executeMove(m){
 if(state.mode==='puzzle'){
  let u=game.makeMove(m),ok=game.isCheckmate();
  if(ok){playSound('win');renderGame();setTimeout(()=>{alert(T('correct'));go('puzzles')},50)}
  else{game.undoMove(u);playSound('capture');selected=null;legalMoves=[];renderGame();setTimeout(()=>alert(T('wrong')),30)}
  return}
 hintMv=null;sans.push(sanOf(m));hist.push(game.makeMove(m));lastMove=m;selected=null;legalMoves=[];sans[sans.length-1]+=suffix();
 feedback(m);renderGame();

function checkEnd(byPlayer){

 return false}

 let t0=Date.now(),best=getBestMove(game,state.botDepth,state.botBlunder),wait=Math.max(0,(delay||0)-(Date.now()-t0));setTimeout(()=>{if(id!==gid||gameOver)return;aiThinking=false;
 if(best){sans.push(sanOf(best));hist.push(game.makeMove(best));lastMove=best;sans[sans.length-1]+=suffix();feedback(best)}

function endGame(reason,won){
 if(gameOver)return;gameOver=true;clearInterval(timerInterval);aiThinking=false;saveGame();

  let ex=1/(1+Math.pow(10,(state.botElo-state.elo)/400)),sc=won?1:drawn?.5:0,ne=Math.max(100,Math.round(state.elo+32*(sc-ex)));
  diff=ne-state.elo;state.elo=ne;
  state.recent.unshift({opponent:T('bot')+' '+state.botElo,result:won?'win':drawn?'draw':'lose',diff});state.recent=state.recent.slice(0,8);save()}

 ${state.mode==='bot'?`<p style="margin:15px 0;font-size:18px;color:${diff>=0?'var(--accent)':'var(--danger)'}">${diff>0?'+'+diff:diff} ELO</p>`:''}<button class="btn primary" onclick="exitGame()">${T('again')}</button></div>`;
 document.body.appendChild(d)}

function sanOf(m){
 let t=m.piece[1],d='abcdefgh'[m.to.c]+(8-m.to.r),s='';
 if(m.special==='castle-k')return'O-O';if(m.special==='castle-q')return'O-O-O';
 if(t==='P'){if(m.captured)s='abcdefgh'[m.from.c]+'x';s+=d;if(m.promotion)s+='='+m.promotion;return s}
 s=t;let o=game.legalMoves().filter(x=>x.piece===m.piece&&x.to.r===m.to.r&&x.to.c===m.to.c&&!(x.from.r===m.from.r&&x.from.c===m.from.c));
 if(o.length){if(!o.some(x=>x.from.c===m.from.c))s+='abcdefgh'[m.from.c];else if(!o.some(x=>x.from.r===m.from.r))s+=8-m.from.r;else s+='abcdefgh'[m.from.c]+(8-m.from.r)}
 return s+(m.captured?'x':'')+d}
function suffix(){return game.isCheckmate()?'#':game.inCheck(game.turn)?'+':''}
function feedback(m){playSound(m.captured?'capture':'move');try{if(navigator.vibrate&&(m.captured||game.inCheck(game.turn)))navigator.vibrate(m.captured?20:[20,40,20])}catch(e){}}
function dayIdx(){return Math.floor(Date.now()/864e5)%PUZZLES.length}
function toFen(g){let s=g.board.map(r=>{let o='',n=0;for(let p of r){if(!p)n++;else{if(n){o+=n;n=0}o+=p[0]==='w'?p[1]:p[1].toLowerCase()}}return o+(n?n:'')}).join('/');
 let c=(g.castling.wK?'K':'')+(g.castling.wQ?'Q':'')+(g.castling.bK?'k':'')+(g.castling.bQ?'q':'')||'-';return s+' '+g.turn+' '+c}
function saveGame(){if(state.mode!=='bot')return;if(gameOver){store.set('ozak_save',null);return}store.set('ozak_save',{fen:toFen(game),pc,w:wTime,b:bTime,i:state.botIdx||0,sans})}

if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
render();
